[project]
name = "still-controller"
version = "0.1.0"
description = "Daemon controlling the Shmidt Spirits still (see PLAN.md)"
requires-python = ">=3.9"
dependencies = [
    "simple-pid>=2.0",
    "PyYAML>=6.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "httpx>=0.27"]

[project.scripts]
still = "still.__main__:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
still = ["static/*", "static/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
